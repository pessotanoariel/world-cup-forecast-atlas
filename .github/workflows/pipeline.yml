name: World Cup Forecast Atlas Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Run pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          set -o pipefail
          mkdir -p execution_logs
          python main.py 2>&1 | tee execution_logs/pipeline.log

      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/output execution_logs
          if git diff --cached --quiet; then
            echo "No refreshed data changes to publish."
          else
            git commit -m "Refresh tournament data outputs"
            git push
          fi

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-cup-forecast-atlas-pipeline
          if-no-files-found: error
          path: |
            data/output/*
            data/processed/*
            execution_logs/*
